services:
  spark-master:
    image: apache/spark:3.5.0-python3
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ../data:/opt/spark/data
      - ../data:/home/jovyan/data
      - ../src:/opt/spark/src
      - ../src:/home/jovyan/src
    command: >
      bash -c "
        /opt/spark/sbin/start-master.sh --host spark-master --port 7077 --webui-port 8080 &&
        tail -f /opt/spark/logs/*.out
      "
    networks:
      - spark-network

  spark-worker-1:
    image: apache/spark:3.5.0-python3
    container_name: spark-worker-1
    hostname: spark-worker-1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    depends_on:
      - spark-master
    volumes:
      - ../data:/opt/spark/data
      - ../data:/home/jovyan/data
      - ../src:/opt/spark/src
      - ../src:/home/jovyan/src
    command: >
      bash -c "
        sleep 4 &&
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 3g --webui-port 8081 &&
        tail -f /opt/spark/logs/*.out
      "
    networks:
      - spark-network

  spark-worker-2:
    image: apache/spark:3.5.0-python3
    container_name: spark-worker-2
    hostname: spark-worker-2
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    depends_on:
      - spark-master
    volumes:
      - ../data:/opt/spark/data
      - ../data:/home/jovyan/data
      - ../src:/opt/spark/src
      - ../src:/home/jovyan/src
    command: >
      bash -c "
        sleep 4 &&
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 3g --webui-port 8081 &&
        tail -f /opt/spark/logs/*.out
      "
    networks:
      - spark-network

  spark-worker-3:
    image: apache/spark:3.5.0-python3
    container_name: spark-worker-3
    hostname: spark-worker-3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    depends_on:
      - spark-master
    volumes:
      - ../data:/opt/spark/data
      - ../data:/home/jovyan/data
      - ../src:/opt/spark/src
      - ../src:/home/jovyan/src
    command: >
      bash -c "
        sleep 4 &&
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 3g --webui-port 8081 &&
        tail -f /opt/spark/logs/*.out
      "
    networks:
      - spark-network

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter-pyspark
    hostname: jupyter-pyspark
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_MASTER=spark://spark-master:7077
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ../data:/home/jovyan/data
      - ../data:/opt/spark/data
      - ../src:/home/jovyan/src
      - ../src:/opt/spark/src
    depends_on:
      - spark-master
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
